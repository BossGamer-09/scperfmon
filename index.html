<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e1a;
            color: #c8d8e8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: linear-gradient(135deg, #0d1117 0%, #0a0e1a 100%);
            border: 1px solid #1f2a3a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .title { font-size: 24px; font-weight: bold; color: #00d4ff; }
        .subtitle { font-size: 12px; color: #6b7c93; margin-top: 5px; }
        .connection-status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .connected { background: #00ff0044; color: #00ff00; border: 1px solid #00ff00; }
        .disconnected { background: #ff000044; color: #ff0000; border: 1px solid #ff0000; }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .metric-card {
            background: #0d1117;
            border: 1px solid #1f2a3a;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .metric-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #6b7c93;
            margin-bottom: 10px;
        }
        .metric-value {
            font-size: 36px;
            font-weight: bold;
            font-family: monospace;
        }
        .metric-unit { font-size: 14px; color: #6b7c93; }
        .metric-sub { font-size: 10px; color: #6b7c93; margin-top: 8px; }
        .btn {
            background: #1f2a3a;
            border: none;
            color: #c8d8e8;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin: 5px;
        }
        .btn:hover { background: #2a3a4a; }
        input {
            background: #0a0e1a;
            border: 2px solid #1f2a3a;
            color: #c8d8e8;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 18px;
            text-align: center;
            letter-spacing: 4px;
            width: 150px;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-online { background: #00ff00; box-shadow: 0 0 5px #00ff00; animation: pulse 2s infinite; }
        .status-offline { background: #ff0000; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <div class="title">STAR CITIZEN MONITOR</div>
            <div class="subtitle" id="specs">Connect to see system specs</div>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Disconnected</span>
            <input type="text" id="sessionInput" placeholder="Session ID" maxlength="6" style="text-transform: uppercase;">
            <button class="btn" onclick="connectWebSocket()">Connect</button>
            <button class="btn" onclick="disconnectWebSocket()" id="disconnectBtn" style="display:none;">Disconnect</button>
        </div>
    </div>
    
    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-label">FPS</div>
            <div><span class="metric-value" id="fps">--</span><span class="metric-unit"> FPS</span></div>
            <div class="metric-sub" id="frametime">-- ms frame time</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">CPU USAGE</div>
            <div><span class="metric-value" id="cpu">--</span><span class="metric-unit">%</span></div>
            <div class="metric-sub" id="cpuCores">-- cores active</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">GPU USAGE</div>
            <div><span class="metric-value" id="gpu">--</span><span class="metric-unit">%</span></div>
            <div class="metric-sub" id="gpuInfo">-- GB VRAM</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">RAM USAGE</div>
            <div><span class="metric-value" id="ram">--</span><span class="metric-unit">%</span></div>
            <div class="metric-sub" id="ramInfo">-- / -- GB</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">SC PROCESS</div>
            <div><span class="metric-value" id="scRam">--</span><span class="metric-unit">MB</span></div>
            <div class="metric-sub" id="scInfo">not detected</div>
        </div>
    </div>
    
    <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
        <button class="btn" onclick="exportData()">Export CSV</button>
        <button class="btn" onclick="location.reload()">Reset</button>
    </div>
</div>

<script>
let ws = null;
let isConnected = false;

function connectWebSocket() {
    const sessionId = document.getElementById('sessionInput').value.trim().toUpperCase();
    if (!sessionId) {
        alert('Please enter a Session ID');
        return;
    }
    
    const wsUrl = `ws://localhost:8765`;
    ws = new WebSocket(wsUrl);
    
    ws.onopen = function() {
        isConnected = true;
        document.getElementById('statusDot').className = 'status-dot status-online';
        document.getElementById('statusText').innerHTML = 'Connected';
        document.getElementById('sessionInput').style.display = 'none';
        document.getElementById('disconnectBtn').style.display = 'inline-block';
    };
    
    ws.onmessage = function(event) {
        const data = JSON.parse(event.data);
        if (data.type === 'hello') {
            document.getElementById('specs').innerHTML = `${data.specs.cpu} | ${data.specs.gpu} | ${data.specs.ram_gb}GB RAM`;
        } else if (data.type === 'perf') {
            updateUI(data);
        }
    };
    
    ws.onerror = function(error) {
        console.error('WebSocket error:', error);
        document.getElementById('statusText').innerHTML = 'Error';
        document.getElementById('statusDot').className = 'status-dot status-offline';
    };
    
    ws.onclose = function() {
        isConnected = false;
        document.getElementById('statusDot').className = 'status-dot status-offline';
        document.getElementById('statusText').innerHTML = 'Disconnected';
        document.getElementById('sessionInput').style.display = 'inline-block';
        document.getElementById('disconnectBtn').style.display = 'none';
    };
}

function disconnectWebSocket() {
    if (ws) {
        ws.close();
    }
}

function updateUI(data) {
    document.getElementById('fps').innerHTML = data.fps || 0;
    document.getElementById('frametime').innerHTML = (data.frame_ms || 0) + ' ms frame time';
    document.getElementById('cpu').innerHTML = data.sys_cpu_pct || 0;
    document.getElementById('gpu').innerHTML = data.gpu_pct || 0;
    document.getElementById('ram').innerHTML = data.sys_ram_pct || 0;
    document.getElementById('scRam').innerHTML = data.proc_ram_mb || 0;
    
    document.getElementById('cpuCores').innerHTML = (data.sys_cpu_per_core || []).filter(c => c > 5).length + ' cores active';
    document.getElementById('gpuInfo').innerHTML = data.gpu_mem_used_gb ? `${data.gpu_mem_used_gb} / ${data.gpu_mem_total_gb} GB` : 'VRAM info';
    document.getElementById('ramInfo').innerHTML = `${data.sys_ram_used_gb || 0} / ${data.sys_ram_total_gb || 0} GB`;
    document.getElementById('scInfo').innerHTML = data.pid ? `PID ${data.pid} · ${(data.proc_ram_mb/1024).toFixed(1)} GB` : 'not detected';
}

function exportData() {
    alert('Data export - check console for implementation');
}
</script>
</body>
</html>
